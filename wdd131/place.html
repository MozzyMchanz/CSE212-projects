<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uganda - The Pearl of Africa</title>
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>
<body>
    <header>
        <h1>Uganda</h1>
        <p>The Pearl of Africa</p>
    </header>
    <main>
        <section class="hero">
            <picture>
                <source srcset="images/uganda-hero-small.webp" media="(max-width: 500px)">
                <source srcset="images/uganda-hero-medium.webp" media="(max-width: 1000px)">
                <img src="images/uganda-hero-large.webp" alt="Scenic view of Lake Victoria in Uganda" width="800" height="400">
            </picture>
        </section>
        <section class="weather">
            <h2>Weather</h2>
            <div class="weather-info">
                <p>Temperature: 25°C</p>
                <p>Wind Speed: 5 km/h</p>
                <p>Wind Chill: <span id="wind-chill">N/A</span></p>
            </div>
        </section>
        <section class="info">
            <h2>About Uganda</h2>
            <p>Uganda, known as the Pearl of Africa, is a landlocked country in East Africa, famous for its diverse wildlife, stunning landscapes, and rich cultural heritage.</p>
        </section>
    </main>
    <footer>
        <p>&copy; <span id="current-year"></span> | Last Modified: <span id="last-modified"></span></p>
    </footer>
</body>
</html>
